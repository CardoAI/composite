name: "Sync Frontend S3 Buckets v1"
description: "Promotes frontend assets between S3 buckets with cache-control metadata."

inputs:
  source-bucket:
    description: "Source S3 bucket name."
    required: true
  destination-bucket:
    description: "Destination S3 bucket name."
    required: true

runs:
  using: "composite"
  steps:
    - name: Sync hashed assets
      shell: bash
      env:
        SOURCE_BUCKET: ${{ inputs.source-bucket }}
        DESTINATION_BUCKET: ${{ inputs.destination-bucket }}
      run: |
        aws s3 sync "s3://${SOURCE_BUCKET}" "s3://${DESTINATION_BUCKET}" \
          --exclude "index.html" \
          --cache-control "public,max-age=31536000,immutable"

    - name: Sync index.html
      shell: bash
      env:
        SOURCE_BUCKET: ${{ inputs.source-bucket }}
        DESTINATION_BUCKET: ${{ inputs.destination-bucket }}
      run: |
        aws s3 sync "s3://${SOURCE_BUCKET}/index.html" "s3://${DESTINATION_BUCKET}/index.html" \
          --cache-control "no-cache,no-store,must-revalidate"
