name: "Build frontend v3"
description: "This action builds frontend with node_modules caching"

inputs:
  working-directory:
    description: Directory containing package.json and yarn.lock.
    default: "."
  cleanup-bucket:
    description: "Delete files from s3 that no longer exist on build."
    default: "false"
    required: false


runs:
  using: composite
  steps:
    - name: Cache node_modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: node-modules-${{ runner.os }}-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory)) }}
        restore-keys: |
          node-modules-${{ runner.os }}-${{ inputs.working-directory }}-

    - name: Build
      id: build-frontend
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: $GITHUB_ACTION_PATH/build.sh
      env:
        CLEANUP_BUCKET: ${{ inputs.cleanup-bucket }}
