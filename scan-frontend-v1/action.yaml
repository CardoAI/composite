name: "Scan frontend v1"
description: "Scan frontend dependencies in normal or report-only mode."

inputs:
  working-directory:
    description: Directory containing package.json and a supported frontend lockfile.
    default: "."
  mode:
    description: "normal blocks fixable CRITICAL vulnerabilities; report-only does not block findings. Scanner errors fail in both modes."
    default: "normal"
  trivy-version:
    description: "Stable Trivy version, with or without v. Defaults to 0.76.1 when omitted or empty."
    default: ""

runs:
  using: composite
  steps:
    - name: Prepare scan report
      id: report
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version || '0.76.1' }}
      run: |
        version="${TRIVY_VERSION#v}"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Trivy version must be a stable release such as 0.76.1 or v0.76.1."
          exit 1
        fi
        report_dir=$(mktemp -d "${RUNNER_TEMP}/frontend-scan.XXXXXX")
        echo "directory=${report_dir}" >> "$GITHUB_OUTPUT"
        echo "trivy-version=${version}" >> "$GITHUB_OUTPUT"

    - name: Cache Trivy release archive
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: ${{ runner.temp }}/frontend-trivy-download
        key: frontend-trivy-archive-v1-${{ steps.report.outputs.trivy-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install Trivy
      shell: bash
      env:
        TRIVY_VERSION: ${{ steps.report.outputs.trivy-version }}
        REPORT_DIRECTORY: ${{ steps.report.outputs.directory }}
      run: bash "${GITHUB_ACTION_PATH}/install-trivy.sh"

    - name: Scan frontend
      id: scan
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        SCAN_MODE: ${{ inputs.mode }}
        REPORT_DIRECTORY: ${{ steps.report.outputs.directory }}
        TRIVY_CACHE_DIR: ${{ steps.report.outputs.directory }}/trivy-cache
      run: bash "${GITHUB_ACTION_PATH}/scan.sh"

    - name: Publish workflow summary
      if: ${{ !cancelled() }}
      shell: bash
      env:
        REPORT_DIRECTORY: ${{ steps.report.outputs.directory }}
        SCAN_OUTCOME: ${{ steps.scan.outcome }}
        SCAN_MODE: ${{ inputs.mode }}
      run: bash "${GITHUB_ACTION_PATH}/write-summary.sh"

    - name: Remove local report
      if: ${{ always() && steps.report.outcome == 'success' }}
      shell: bash
      env:
        REPORT_DIRECTORY: ${{ steps.report.outputs.directory }}
      run: rm -rf -- "$REPORT_DIRECTORY"
